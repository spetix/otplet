name: Create GH Pages (MkDocs + mike)
    tags: ["[0-9]*.[0-9]*.[0-9]*"] # glob-style, not regex
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install mkdocs mkdocs-material mike

      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # --- Sync landing site (main/site -> ghpages/site) ---
      - name: Checkout ghpages branch
        run: |
          git fetch origin gh-pages:gh-pages || true
          git checkout gh-pages || git checkout --orphan gh-pages

      - name: Sync landing + assets from main
        run: |
          git rm -r --ignore-unmatch site
          git checkout main -- site
          git add site
          git commit -m "Sync landing site" || true
          git push origin gh-pages

      # --- Build + deploy docs with mike into site/versions ---
      - name: Checkout main for docs build context
        run: git checkout main

      # main -> dev
      - name: Deploy dev docs
        if: startsWith(github.ref, 'refs/heads/main')
        run: |
          mike deploy --branch gh-pages --push --prefix site/versions dev

      # tag x.y.z -> x.y.z + update latest + set default latest
      - name: Deploy release docs
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mike deploy --branch gh-pages --push --update-aliases --prefix site/versions "${{ github.ref_name }}" latest
          mike set-default --branch gh-pages --push --prefix site/versions latest

on:
  push:
