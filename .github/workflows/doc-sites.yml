name: Create GH Pages (MkDocs + mike)

on:
  push:
    branches: [ "main" ]
    tags: [ "[0-9]+.[0-9]+.[0-9]+" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install mkdocs mkdocs-material mike

      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # ===============================
      # ✅ Landing sync (main → gh-pages/site)
      # ===============================
      - name: Checkout gh-pages branch
        run: |
          git fetch origin gh-pages:gh-pages || true
          git checkout gh-pages || git checkout --orphan gh-pages

      - name: Sync landing (preserve versions/)
        run: |
          mkdir -p site
          rsync -av --delete \
            --exclude versions \
            $(git --git-dir=../.git --work-tree=../ checkout main -- site >/dev/null 2>&1 || echo main/site/) \
            ../site/ ./site/ || true

          git add site
          git commit -m "Sync landing site (preserve versions)" || true
          git push origin gh-pages

      # ===============================
      # ✅ Back to main for mike
      # ===============================
      - name: Checkout main for docs
        run: git checkout main

      # main → dev
      - name: Deploy dev docs
        if: startsWith(github.ref, 'refs/heads/main')
        run: |
          mike deploy --branch gh-pages --push --prefix site/versions dev

      # tag → version + latest
      - name: Deploy release docs
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mike deploy --branch gh-pages --push --update-aliases "${{ github.ref_name }}" latest --prefix site/versions
          mike set-default --branch gh-pages --push --prefix site/versions latest