name: project ci

on: [push, pull_request]

permissions:
  pull-requests: write
  contents: write

jobs:
  build:
    name: builder
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go environment
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Get dependencies
        run: make setup

      - name: Build All
        run: make build

      - name: Save build binaries
        uses: actions/upload-artifact@v4
        with:
          name: otp_blocket-bundle
          path: bin

      - name: Test
        run: make test

      - name: Upload Go test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.json

      - name: Convert go coverage to cobertura format
        run: make coverage

      - name: Generate code coverage report
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: coverage.xml
          badge: true
          fail_below_min: true
          format: markdown
          hide_branch_rate: false
          hide_complexity: true
          indicators: true
          output: both
          thresholds: '20 40'  # lower upper [2](https://github-wiki-see.page/m/irongut/CodeCoverageSummary/wiki/Using-Code-Coverage-Summary)

      # --- GitHub-only coverage badge (published to gh-pages) ---
      - name: Create coverage.svg badge
        if: github.ref == 'refs/heads/main'
        run: |
          # Cobertura line-rate is a fraction (e.g. 0.83) -> percent
          rate=$(grep -oP '(?<=line-rate=")[0-9.]+' coverage.xml | head -1)
          pct=$(python - <<'PY'
          import os
          r=float(os.environ["rate"])
          print(int(round(r*100)))
          PY
          
          )
          echo "Coverage: ${pct}%"
          # Color bands: <50 red, 50-74 yellow, >=75 green
          if [ "$pct" -ge 75 ]; then color="brightgreen";
          elif [ "$pct" -ge 50 ]; then color="yellow";
          else color="red"; fi
          curl -fsSL "https://img.shields.io/badge/coverage-${pct}%25-${color}" -o coverage.svg

      - name: Publish coverage.svg to gh-pages
        if: github.ref == 'refs/heads/main'
        run: |
          git fetch origin gh-pages:gh-pages || true
          git checkout gh-pages || git checkout --orphan gh-pages

          # place at gh-pages root: https://<user>.github.io/<repo>/coverage.svg
          mv -f ../coverage.svg ./coverage.svg

          git add coverage.svg
          git commit -m "Update coverage badge" || true
          git push origin gh-pages

      # --- release & site deployment (unchanged) ---
      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: true
          make_latest: true
          files: |
            bin/otp_blocket-*
            README.md

      - name: Prepare site
        run: make prepare-site
        if: startsWith(github.ref, 'refs/tags/')

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          folder: build/site
``
