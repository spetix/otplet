name: project ci + docs

on:
  push:
    branches:
      - main
    tags:
      - '*.*.*'
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # --- checkout ---
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --- backend build ---
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup deps
        run: make setup

      - name: Build
        run: make build

      - name: Test
        run: make test

      # --- coverage ---
      - name: Generate coverage (cobertura)
        run: make coverage

      - name: Generate HTML coverage report
        run: |
          mkdir -p coverage
          go tool cover -html=coverage.out -o coverage/index.html

      - name: Upload coverage artifact (optional debug)
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: coverage/

      # --- badge (main only) ---
      - name: Create coverage.svg badge
        if: github.ref == 'refs/heads/main'
        run: |
          pct=$(python - <<'PY'
          import re, pathlib
          xml = pathlib.Path("coverage.xml").read_text()
          m = re.search(r'line-rate="([0-9.]+)"', xml)
          print(int(float(m.group(1))*100))
          PY
          )
          if [ "$pct" -ge 75 ]; then color="brightgreen";
          elif [ "$pct" -ge 50 ]; then color="yellow";
          else color="red"; fi
          curl -fsSL "https://img.shields.io/badge/coverage-${pct}%25-${color}" -o coverage.svg

      - name: Publish coverage.svg
        if: github.ref == 'refs/heads/main'
        run: |
          git fetch origin gh-pages:gh-pages || true
          git checkout gh-pages || git checkout --orphan gh-pages

          mv -f ../coverage.svg ./coverage.svg
          git add coverage.svg
          git commit -m "Update coverage badge" || true
          git push origin gh-pages

      # --- docusaurus build (tags only) ---
      - name: Setup Node
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Install docs deps
        if: startsWith(github.ref, 'refs/tags/')
        run: npm ci
        working-directory: docs-site

      - name: Inject coverage into docs
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          rm -rf docs-site/static/coverage
          mkdir -p docs-site/static/coverage
          cp -r coverage/* docs-site/static/coverage/

      - name: Build docs
        if: startsWith(github.ref, 'refs/tags/')
        run: npm run build
        working-directory: docs-site

      - name: Deploy docs
        if: startsWith(github.ref, 'refs/tags/')
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs-site/build

      # --- release ---
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          make_latest: true
          files: |
            bin/*
            README.md